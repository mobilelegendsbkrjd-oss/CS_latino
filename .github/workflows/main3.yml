name: Build TodoTV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build TodoTV
        run: ./gradlew :todotv:make

      - name: Upload CS3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: todotv-cs3
          path: |
            **/todotv/build/**/*.cs3
            **/todotv/build/**/*.apk
            **/build/**/*.cs3
          if-no-files-found: warn
